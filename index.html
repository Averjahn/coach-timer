<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Секундомеры тренера</title>
<style>
  :root{
    --bg:#f3f5fa;
    --panel:#ffffff;
    --panel-2:#eef1f8;
    --border:#dde3ef;
    --text:#161c2c;
    --muted:#6b7690;
    --green:#16a34a;
    --green-d:#15803d;
    --red:#dc2626;
    --red-d:#b91c1c;
    --blue:#2563eb;
    --blue-d:#1d4ed8;
    --amber:#d97706;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-user-select:none;
    user-select:none;
    overscroll-behavior:none;
  }
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  h1 span{color:var(--muted);font-weight:500;font-size:14px;display:block;margin-top:2px;}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
    border-radius:12px;
    font-weight:600;
    transition:transform .06s ease, filter .1s ease, opacity .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:scale(0.96);}
  .btn{
    padding:11px 18px;
    font-size:15px;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn:hover{filter:brightness(1.15);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:var(--blue-d);}

  .tabs{display:flex;gap:6px;padding:10px 20px 0;}
  .tab{
    padding:9px 16px;font-size:14px;border-radius:10px 10px 0 0;
    background:transparent;color:var(--muted);border:1px solid transparent;
  }
  .tab.active{background:var(--panel);color:var(--text);border:1px solid var(--border);border-bottom-color:var(--panel);}

  main{padding:18px 20px 40px;max-width:1600px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .empty .big{font-size:44px;margin-bottom:10px;}

  /* Add athlete panel */
  .add-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:18px;
  }
  .add-panel textarea{
    width:100%;min-height:70px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font-family:inherit;font-size:15px;resize:vertical;
  }
  .add-panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--muted);}

  /* ---- Heats table ---- */
  .table-wrap{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:auto;
    box-shadow:0 1px 3px rgba(22,28,44,0.06);
    max-width:100%;
  }
  table.heats{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
  }
  table.heats th, table.heats td{
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    padding:0;
    text-align:center;
    white-space:nowrap;
  }
  table.heats thead th{
    background:var(--panel-2);
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    font-weight:700;
    padding:9px 10px;
  }
  .col-athlete{
    position:sticky;left:0;z-index:6;
    background:var(--panel);
    text-align:left !important;
    min-width:170px;
    padding:0 !important;
  }
  thead .col-athlete{background:var(--panel-2);z-index:7;}
  .col-start, .col-finish{min-width:118px;}

  .name-cell{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
  }
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .status-dot.running{background:var(--green);box-shadow:0 0 8px var(--green);}
  .name-text{
    font-size:15px;font-weight:700;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;
  }
  .row-icon-btn{
    background:transparent;color:var(--muted);
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .row-icon-btn:hover{background:var(--panel-2);color:var(--text);}

  .heat-cell{
    padding:8px;height:76px;
    vertical-align:middle;
  }
  .heat-cell.running-start{background:rgba(22,163,74,0.07);}
  .heat-cell.running-finish{background:rgba(22,163,74,0.07);}
  .cell-value{font-family:ui-monospace,monospace;font-weight:600;font-size:13px;color:var(--muted);}
  .cell-dur{
    font-family:'SF Mono','Roboto Mono',ui-monospace,monospace;
    font-weight:800;font-size:26px;color:var(--text);
    letter-spacing:.3px;line-height:1.1;
  }
  .cell-dash{color:var(--border);font-size:16px;}
  .cell-btn{
    padding:12px 6px;font-size:13px;width:100%;min-width:96px;
  }
  .btn-heat-start{background:var(--green);color:#fff;}
  .btn-heat-start:hover{background:var(--green-d);}
  .btn-heat-finish{background:var(--red);color:#fff;}
  .btn-heat-finish:hover{background:var(--red-d);}
  .cell-live{
    font-family:'SF Mono','Roboto Mono',ui-monospace,monospace;
    font-weight:800;font-size:26px;color:var(--green);letter-spacing:.3px;
  }

  .col-action{min-width:64px;}
  .action-btn{
    width:44px;height:44px;border-radius:12px;
    background:var(--green);color:#fff;font-size:20px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .action-btn:hover{background:var(--green-d);}

  .heats tbody tr:last-child td{border-bottom:none;}
  .heats th:last-child, .heats td:last-child{border-right:none;}

  /* ---- History table: one row per athlete, times in a single line ---- */
  .history-table{width:100%;border-collapse:collapse;}
  .hist-th{
    text-align:left;padding:11px 14px;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px;background:var(--panel-2);
    border-bottom:1px solid var(--border);
  }
  .hist-th-name{width:1%;white-space:nowrap;}
  .hist-row td{border-bottom:1px solid var(--border);padding:14px;vertical-align:middle;}
  .hist-row:last-child td{border-bottom:none;}
  .hist-name{font-size:15px;font-weight:700;white-space:nowrap;}
  .hist-count{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;}
  .hist-results{
    display:flex;align-items:center;gap:8px;
    overflow-x:auto;white-space:nowrap;padding-bottom:2px;
  }
  .hist-chip{
    display:inline-flex;align-items:baseline;gap:6px;flex-shrink:0;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:6px 10px;
  }
  .hist-chip .n{font-size:11px;color:var(--muted);font-weight:700;}
  .hist-chip .t{
    font-family:'SF Mono','Roboto Mono',ui-monospace,monospace;
    font-weight:800;font-size:17px;color:var(--text);
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:22px;max-width:360px;width:100%;
  }
  .modal p{margin:0 0 18px;font-size:15px;color:var(--text);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;
    opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;
    box-shadow:0 8px 24px rgba(22,28,44,0.18);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    header{padding:12px 14px;}
    main{padding:14px 14px 30px;}
    .col-athlete{min-width:130px;}
    .col-start, .col-finish{min-width:100px;}
  }
</style>
</head>
<body>

<header>
  <h1>⏱ Секундомеры <span id="sessionLabel">Тренировка</span></h1>
  <div class="header-actions">
    <button class="btn" id="btnShowAdd">+ Спортсмен</button>
    <button class="btn" id="btnClearRun" title="Очистить все заезды всех спортсменов">Новая сессия</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-view="timers">Секундомеры</button>
  <button class="tab" data-view="history">История результатов</button>
</div>

<main>

  <div class="view active" id="view-timers">
    <div class="add-panel" id="addPanel" style="display:none;">
      <textarea id="namesInput" placeholder="Введите фамилии — по одной на строку или через запятую&#10;Например:&#10;Иванов&#10;Петров&#10;Сидорова"></textarea>
      <div class="add-panel-actions">
        <span class="hint">Можно вставить сразу целый список</span>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="btnCancelAdd">Отмена</button>
          <button class="btn primary" id="btnConfirmAdd">Добавить</button>
        </div>
      </div>
    </div>

    <div id="emptyState" class="empty" style="display:none;">
      <div class="big">🏃</div>
      <div>Пока нет ни одного спортсмена.<br>Нажмите «+ Спортсмен», чтобы добавить список.</div>
    </div>

    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table class="heats" id="heatsTable">
        <thead id="heatsHead"></thead>
        <tbody id="heatsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="view" id="view-history">
    <div class="history-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;">
      <div class="hint" id="historyCount"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="btnExportCsv">Экспорт CSV</button>
      </div>
    </div>
    <div id="historyEmpty" class="empty" style="display:none;">
      <div class="big">📋</div>
      <div>Результатов пока нет.<br>Останавливайте секундомеры — время будет сохраняться сюда.</div>
    </div>
    <div class="table-wrap" id="historyWrap" style="display:none;">
      <table id="historyTable" class="history-table">
        <thead>
          <tr>
            <th class="hist-th hist-th-name">Спортсмен</th>
            <th class="hist-th">Результаты</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Отмена</button>
      <button class="btn" id="modalOk" style="background:var(--red);color:#fff;">Удалить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "coach-timer-state-v2";

  /* ---------- state ----------
     athlete: { id, name, attempts: [ {start: epochMs, finish: epochMs|null}, ... ] }
     attempts is append-only (except "undo last" which pops the final entry).
  ------------------------------ */
  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var s = JSON.parse(raw);
        s.athletes = s.athletes || [];
        s.athletes.forEach(function(a){ a.attempts = a.attempts || []; });
        return s;
      }
    }catch(e){}
    return { athletes: [], nextId: 1 };
  }

  var saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }, 150);
  }

  function uid(){
    state.nextId = (state.nextId || 1) + 1;
    return "a" + state.nextId + "_" + Date.now().toString(36);
  }

  /* ---------- helpers ---------- */
  function pad(n,l){ n=String(n); while(n.length<l) n="0"+n; return n; }

  function fmtDur(ms){
    if(ms < 0) ms = 0;
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs / 100);
    var s = totalSec % 60;
    var m = Math.floor(totalSec / 60);
    if(m > 0) return pad(m,2)+":"+pad(s,2)+"."+pad(cs,2);
    return pad(s,2)+"."+pad(cs,2);
  }

  function fmtClock(ms){
    var d = new Date(ms);
    return pad(d.getHours(),2)+":"+pad(d.getMinutes(),2)+":"+pad(d.getSeconds(),2);
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function findAthlete(id){
    for(var i=0;i<state.athletes.length;i++){
      if(state.athletes[i].id === id) return state.athletes[i];
    }
    return null;
  }

  function isRunning(a){
    var last = a.attempts[a.attempts.length-1];
    return !!(last && last.finish === null);
  }

  /* ---------- actions ---------- */
  function startHeat(athleteId){
    var a = findAthlete(athleteId);
    if(!a || isRunning(a)) return;
    a.attempts.push({ start: Date.now(), finish: null });
    persist();
    renderTable();
  }

  function finishHeat(athleteId){
    var a = findAthlete(athleteId);
    if(!a || !isRunning(a)) return;
    a.attempts[a.attempts.length-1].finish = Date.now();
    persist();
    renderTable();
    renderHistory();
    var last = a.attempts[a.attempts.length-1];
    toast(a.name + ": записано " + fmtDur(last.finish - last.start));
  }

  function undoLastHeat(athleteId){
    var a = findAthlete(athleteId);
    if(!a || !a.attempts.length) return;
    a.attempts.pop();
    persist();
    renderTable();
    renderHistory();
  }

  function addAthletes(names){
    var added = 0;
    names.forEach(function(n){
      n = n.trim();
      if(!n) return;
      state.athletes.push({ id: uid(), name: n, attempts: [] });
      added++;
    });
    if(added){
      persist();
      renderTable();
      toast(added === 1 ? "Спортсмен добавлен" : (added + " спортсменов добавлено"));
    }
  }

  function removeAthlete(id){
    state.athletes = state.athletes.filter(function(a){ return a.id !== id; });
    persist();
    renderTable();
    renderHistory();
  }

  function confirmDeleteAthlete(id, name){
    showModal("Удалить спортсмена «" + name + "»? Все его заезды тоже удалятся.", function(){
      removeAthlete(id);
      toast("Удалено: " + name);
    });
  }

  /* ---------- table rendering ---------- */
  var tableWrap = document.getElementById("tableWrap");
  var emptyState = document.getElementById("emptyState");
  var heatsHead = document.getElementById("heatsHead");
  var heatsBody = document.getElementById("heatsBody");

  function maxCols(){
    var max = 1;
    state.athletes.forEach(function(a){
      max = Math.max(max, a.attempts.length);
    });
    return max;
  }

  function renderTable(){
    emptyState.style.display = state.athletes.length === 0 ? "block" : "none";
    tableWrap.style.display = state.athletes.length === 0 ? "none" : "block";
    if(state.athletes.length === 0) return;

    var cols = maxCols();

    // header
    var htr1 = document.createElement("tr");
    var thName = document.createElement("th");
    thName.className = "col-athlete";
    thName.textContent = "Спортсмен";
    thName.rowSpan = 2;
    htr1.appendChild(thName);
    var htr2 = document.createElement("tr");
    for(var c=0;c<cols;c++){
      var thHeat = document.createElement("th");
      thHeat.colSpan = 2;
      thHeat.textContent = "Заезд " + (c+1);
      htr1.appendChild(thHeat);

      var thS = document.createElement("th");
      thS.className = "col-start";
      thS.textContent = "Старт";
      var thF = document.createElement("th");
      thF.className = "col-finish";
      thF.textContent = "Финиш";
      htr2.appendChild(thS);
      htr2.appendChild(thF);
    }
    var thAction = document.createElement("th");
    thAction.className = "col-action";
    thAction.rowSpan = 2;
    thAction.textContent = "";
    htr1.appendChild(thAction);
    heatsHead.innerHTML = "";
    heatsHead.appendChild(htr1);
    heatsHead.appendChild(htr2);

    // body
    heatsBody.innerHTML = "";
    state.athletes.forEach(function(a){
      var running = isRunning(a);
      var tr = document.createElement("tr");
      tr.id = "row-" + a.id;

      var tdName = document.createElement("td");
      tdName.className = "col-athlete";
      var nameCell = document.createElement("div");
      nameCell.className = "name-cell";
      var dot = document.createElement("div");
      dot.className = "status-dot" + (running ? " running" : "");
      dot.id = "dot-" + a.id;
      var nameText = document.createElement("div");
      nameText.className = "name-text";
      nameText.textContent = a.name;
      var undoBtn = document.createElement("button");
      undoBtn.className = "row-icon-btn";
      undoBtn.innerHTML = "&#8630;";
      undoBtn.title = "Отменить последний заезд";
      undoBtn.style.visibility = a.attempts.length ? "visible" : "hidden";
      undoBtn.onclick = function(){ undoLastHeat(a.id); };
      var delBtn = document.createElement("button");
      delBtn.className = "row-icon-btn";
      delBtn.innerHTML = "&#10005;";
      delBtn.title = "Удалить спортсмена";
      delBtn.onclick = function(){ confirmDeleteAthlete(a.id, a.name); };
      nameCell.appendChild(dot);
      nameCell.appendChild(nameText);
      nameCell.appendChild(undoBtn);
      nameCell.appendChild(delBtn);
      tdName.appendChild(nameCell);
      tr.appendChild(tdName);

      for(var c=0;c<cols;c++){
        var attempt = a.attempts[c];
        var tdStart = document.createElement("td");
        tdStart.className = "heat-cell col-start";
        var tdFinish = document.createElement("td");
        tdFinish.className = "heat-cell col-finish";

        if(attempt){
          var startVal = document.createElement("div");
          startVal.className = "cell-value";
          startVal.textContent = fmtClock(attempt.start);
          tdStart.appendChild(startVal);

          if(attempt.finish !== null){
            var dur = document.createElement("div");
            dur.className = "cell-dur";
            dur.textContent = fmtDur(attempt.finish - attempt.start);
            var finVal = document.createElement("div");
            finVal.className = "cell-value";
            finVal.textContent = fmtClock(attempt.finish);
            tdFinish.appendChild(dur);
            tdFinish.appendChild(finVal);
          } else {
            tdStart.classList.add("running-start");
            tdFinish.classList.add("running-finish");
            var live = document.createElement("div");
            live.className = "cell-live";
            live.id = "live-" + a.id;
            live.textContent = fmtDur(Date.now() - attempt.start);
            var finishBtn = document.createElement("button");
            finishBtn.className = "cell-btn btn-heat-finish";
            finishBtn.textContent = "■ Финиш";
            finishBtn.onclick = function(){ finishHeat(a.id); };
            tdFinish.appendChild(live);
            tdFinish.appendChild(finishBtn);
          }
        } else {
          tdStart.innerHTML = "<span class='cell-dash'>—</span>";
          tdFinish.innerHTML = "<span class='cell-dash'>—</span>";
        }

        tr.appendChild(tdStart);
        tr.appendChild(tdFinish);
      }

      var tdAction = document.createElement("td");
      tdAction.className = "col-action";
      if(!running){
        var startBtn = document.createElement("button");
        startBtn.className = "action-btn";
        startBtn.innerHTML = "&#9654;";
        startBtn.title = "Начать заезд " + (a.attempts.length + 1);
        startBtn.onclick = function(){ startHeat(a.id); };
        tdAction.appendChild(startBtn);
      }
      tr.appendChild(tdAction);

      heatsBody.appendChild(tr);
    });
  }

  /* ---------- ticking ---------- */
  setInterval(function(){
    state.athletes.forEach(function(a){
      if(isRunning(a)){
        var attempt = a.attempts[a.attempts.length-1];
        var el = document.getElementById("live-" + a.id);
        if(el) el.textContent = fmtDur(Date.now() - attempt.start);
      }
    });
  }, 50);

  /* ---------- add panel ---------- */
  var addPanel = document.getElementById("addPanel");
  document.getElementById("btnShowAdd").onclick = function(){
    addPanel.style.display = addPanel.style.display === "none" ? "block" : "none";
    if(addPanel.style.display === "block") document.getElementById("namesInput").focus();
  };
  document.getElementById("btnCancelAdd").onclick = function(){
    addPanel.style.display = "none";
    document.getElementById("namesInput").value = "";
  };
  document.getElementById("btnConfirmAdd").onclick = function(){
    var raw = document.getElementById("namesInput").value;
    var names = raw.split(/[\n,]/);
    addAthletes(names);
    document.getElementById("namesInput").value = "";
    addPanel.style.display = "none";
  };

  document.getElementById("btnClearRun").onclick = function(){
    var any = state.athletes.some(function(a){ return a.attempts.length > 0; });
    if(!any){ toast("Нечего очищать"); return; }
    showModal("Начать новую сессию? Все заезды всех спортсменов будут удалены (список спортсменов останется).", function(){
      state.athletes.forEach(function(a){ a.attempts = []; });
      persist();
      renderTable();
      renderHistory();
      toast("Новая сессия начата");
    });
  };

  /* ---------- modal ---------- */
  var modalBackdrop = document.getElementById("modalBackdrop");
  var modalText = document.getElementById("modalText");
  var modalOkHandler = null;
  function showModal(text, onOk){
    modalText.textContent = text;
    modalOkHandler = onOk;
    modalBackdrop.classList.add("show");
  }
  function hideModal(){
    modalBackdrop.classList.remove("show");
    modalOkHandler = null;
  }
  document.getElementById("modalCancel").onclick = hideModal;
  document.getElementById("modalOk").onclick = function(){
    if(modalOkHandler) modalOkHandler();
    hideModal();
  };
  modalBackdrop.onclick = function(e){ if(e.target === modalBackdrop) hideModal(); };

  /* ---------- tabs ---------- */
  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function(tab){
    tab.onclick = function(){
      tabs.forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
      document.getElementById("view-" + tab.dataset.view).classList.add("active");
      if(tab.dataset.view === "history") renderHistory();
    };
  });

  /* ---------- history view (flat, chronological, exportable) ---------- */
  var historyWrap = document.getElementById("historyWrap");
  var historyEmpty = document.getElementById("historyEmpty");
  var historyCount = document.getElementById("historyCount");
  var historyBody = document.getElementById("historyBody");

  function historyByAthlete(){
    var rows = [];
    state.athletes.forEach(function(a){
      var results = [];
      a.attempts.forEach(function(att, idx){
        if(att.finish !== null){
          results.push({ heatIndex: idx+1, start:att.start, finish:att.finish, dur: att.finish - att.start });
        }
      });
      if(results.length){
        rows.push({ athleteId:a.id, athleteName:a.name, results:results });
      }
    });
    return rows;
  }

  function renderHistory(){
    var rows = historyByAthlete();
    var totalAttempts = rows.reduce(function(sum,r){ return sum + r.results.length; }, 0);
    historyEmpty.style.display = rows.length === 0 ? "block" : "none";
    historyWrap.style.display = rows.length === 0 ? "none" : "block";
    historyCount.textContent = rows.length ? (rows.length + " спортсменов, " + totalAttempts + " результатов") : "";

    historyBody.innerHTML = "";
    rows.forEach(function(r){
      var tr = document.createElement("tr");
      tr.className = "hist-row";

      var tdName = document.createElement("td");
      var nameEl = document.createElement("div");
      nameEl.className = "hist-name";
      nameEl.textContent = r.athleteName;
      var countEl = document.createElement("div");
      countEl.className = "hist-count";
      countEl.textContent = r.results.length + (r.results.length === 1 ? " заезд" : " заездов");
      tdName.appendChild(nameEl);
      tdName.appendChild(countEl);

      var tdResults = document.createElement("td");
      var wrap = document.createElement("div");
      wrap.className = "hist-results";
      r.results.forEach(function(res){
        var chip = document.createElement("span");
        chip.className = "hist-chip";
        chip.title = "Заезд " + res.heatIndex + ": " + fmtClock(res.start) + " → " + fmtClock(res.finish);
        chip.innerHTML = "<span class='n'>#" + res.heatIndex + "</span><span class='t'>" + fmtDur(res.dur) + "</span>";
        wrap.appendChild(chip);
      });
      tdResults.appendChild(wrap);

      tr.appendChild(tdName);
      tr.appendChild(tdResults);
      historyBody.appendChild(tr);
    });
  }

  document.getElementById("btnExportCsv").onclick = function(){
    var rows = historyByAthlete();
    if(!rows.length){ toast("Нет данных для экспорта"); return; }
    var maxHeats = Math.max.apply(null, rows.map(function(r){ return r.results.length; }));
    var header = ["Спортсмен"];
    for(var i=1;i<=maxHeats;i++) header.push("Заезд " + i);
    var out = [header];
    rows.forEach(function(r){
      var line = [r.athleteName];
      for(var i=0;i<maxHeats;i++){
        line.push(r.results[i] ? fmtDur(r.results[i].dur) : "");
      }
      out.push(line);
    });
    var csv = out.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(";");
    }).join("\n");
    var blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "результаты_" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  /* ---------- init ---------- */
  renderTable();
  renderHistory();

  // prevent accidental pull-to-refresh / double-tap zoom on tablets
  document.addEventListener("touchmove", function(e){
    if(e.scale !== 1){ e.preventDefault(); }
  }, { passive:false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300){ e.preventDefault(); }
    lastTouchEnd = now;
  }, false);

})();
</script>
</body>
</html>
